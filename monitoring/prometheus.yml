global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: cloudrescue-monitor
    static_configs:
      - targets: ["monitor:8001"]

  - job_name: demo-service
    metrics_path: /metrics
    static_configs:
      - targets: ["demo-service:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Only present when the "host-metrics" compose profile is enabled (see docker-compose.yml).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
