name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # least privilege for the default token

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain note: actions are pinned to major versions here for readability. For a production
# repository pin each one to a full commit SHA (Dependabot, configured below, keeps them fresh).
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (includes bandit-style security rules)
        run: ruff check .
      - name: Unit + process-level integration tests
        run: python -m pytest -m "not e2e"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile host-metrics config --quiet
      - name: Build images
        run: docker compose build
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: monitor/Dockerfile
          failure-threshold: error
      - name: End-to-end self-healing test (real containers)
        run: |
          python -m pip install requests pytest
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$(getent group docker | cut -d: -f3)/" .env
          CLOUDRESCUE_E2E=1 python -m pytest tests/integration/test_e2e_recovery.py -m e2e -s
        env:
          PYTHONPATH: monitor
      - if: always()
        run: docker compose logs --no-color monitor docker-guard | tail -200
      - if: always()
        run: docker compose down -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - name: Validate
        run: |
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/cloudrescue
          terraform validate
      - name: IaC security scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: true   # findings are reported; tighten to a hard fail once triaged

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
